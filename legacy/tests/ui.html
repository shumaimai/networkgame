<!doctype html>
<meta charset="utf-8">
<title>ui tests</title>
<!-- http 経由で開くこと (python -m http.server)。file:// では iframe の中身に触れない -->
<iframe id="f" src="../index.html" style="width:1400px;height:900px;border:0"></iframe>
<pre id="out">RUNNING</pre>
<script src="../js/levels.js"></script>
<script src="solutions.js"></script>
<script>
'use strict';
const out = [];
let failed = 0;
const ok = (c, m) => { out.push((c ? 'ok   ' : 'FAIL ') + m); if (!c) failed++; };
const f = document.getElementById('f');
let ran = false;

async function run() {
  if (ran || !f.contentWindow || !f.contentWindow.Game) return;
  ran = true;
  const win = f.contentWindow, doc = win.document, G = win.Game;
  const errors = [];
  win.addEventListener('error', e => errors.push(e.message));
  win.addEventListener('unhandledrejection', e => errors.push(String(e.reason)));
  const q = s => doc.querySelector(s), qa = s => [...doc.querySelectorAll(s)];
  const center = el => { const r = el.getBoundingClientRect(); return { clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }; };
  const fire = (type, target, at) => target.dispatchEvent(new win.PointerEvent(type, { bubbles: true, button: 0, ...at }));
  const pointer = (type, el, target = el) => fire(type, target, center(el));
  const input = (sel, v) => { const el = q(sel); el.value = v; el.dispatchEvent(new win.Event('input', { bubbles: true })); };
  const check = (sel, on) => { const el = q(sel); el.checked = on; el.dispatchEvent(new win.Event('input', { bubbles: true })); };
  const lastLog = () => q('#console').lastChild.textContent;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // 机の上の座標(SVG) → 画面座標
  const deskAt = (x, y) => { const m = q('#canvas').getScreenCTM(); return { clientX: m.a * x + m.e, clientY: m.d * y + m.f }; };
  const dragTile = (key, x, y) => {
    const tile = q(`[data-pal="${key}"]`), from = center(tile), to = deskAt(x, y);
    fire('pointerdown', tile, from);
    fire('pointermove', win, { clientX: from.clientX - 40, clientY: from.clientY + 10 });
    const ghostShown = !q('#ghost').classList.contains('hidden');
    fire('pointermove', win, to);
    fire('pointerup', win, to);
    return ghostShown;
  };
  const api = { put: id => G.put(id), buy: t => G.buy(t), link: G.connect, unplug: G.unplug, cfg: x => G.device(x).cfg };
  const board = () => qa('#modal .lv').map(b => ({ id: (b.dataset.id || ''), open: !b.disabled, text: b.textContent }));
  try {
    G.resetAll();
    ok(G.state().money === 30000 && G.funds() === 30000, '初期資金 30000');
    ok(q('#modal').classList.contains('hidden'), 'リセット後はモーダルなし');
    ok(/見習い/.test(q('#rank').textContent), '最初のランクは見習い');

    // --- 構築の依頼は空の机から始まる ---
    ok(G.devices().length === 0 && !!q('.empty-hint'), '依頼1は机が空で、案内文が出る');
    ok(qa('[data-pal^="sup:"]').length === 3 && qa('[data-pal^="buy:"]').length === 1, '右のパレットにお客様の機器3つと購入機材1つ');
    ok(G.results().every(r => !r.ok) && /机に置かれていません/.test(q('.reqs').textContent), '置いていない機器が理由として表示される');

    // --- パレットから机へドラッグ ---
    ok(dragTile('sup:pc1', 300, 480), 'ドラッグ中はつまんだ機材が表示される');
    const pc1 = G.device('pc1');
    ok(!!pc1 && Math.abs(pc1.x - 300) < 3 && Math.abs(pc1.y - 480) < 3, `ドロップした位置にPC-1が置かれる (${pc1 && pc1.x},${pc1 && pc1.y})`);
    ok(!q('[data-pal="sup:pc1"]') && q('#ghost').classList.contains('hidden'), '置いた機器はパレットから消える');
    dragTile('buy:l2', 500, 300);
    const sw = G.devices().find(d => d.type === 'l2');
    ok(!!sw && G.funds() === 22000 && Math.abs(sw.x - 500) < 3, 'L2スイッチをドラッグで購入・設置');
    const tile = q('[data-pal="sup:pc2"]'), off = center(q('#order'));
    fire('pointerdown', tile, center(tile)); fire('pointermove', win, off); fire('pointerup', win, off);
    ok(!G.device('pc2'), '机の外で離すと置かれない');
    pointer('pointerdown', q('[data-pal="sup:pc2"]')); pointer('pointerup', q('[data-pal="sup:pc2"]'), win);
    pointer('pointerdown', q('[data-pal="sup:prn1"]')); pointer('pointerup', q('[data-pal="sup:prn1"]'), win);
    const pc2 = G.device('pc2'), prn = G.device('prn1');
    ok(!!pc2 && !!prn && (Math.abs(pc2.x - prn.x) > 60 || Math.abs(pc2.y - prn.y) > 60) && (Math.abs(pc2.x - pc1.x) > 60 || Math.abs(pc2.y - pc1.y) > 60), 'クリックで置いた機器は重ならない');

    // --- 配線 ---
    pointer('pointerdown', q('[data-port="pc1:0"]'));
    pointer('pointerup', q('[data-port="pc1:0"]'), win);
    ok(!!q('.rubber'), '配線中のガイド線が出る');
    pointer('pointerdown', q(`[data-port="${sw.id}:0"]`));
    ok(G.cables().length === 1 && G.funds() === 21500, 'ポートのクリック2回で配線され、ケーブル代が引かれる');
    pointer('pointerdown', q('[data-port="pc2:0"]'));
    pointer('pointerup', q('[data-port="pc2:0"]'), win);
    pointer('pointerdown', q(`[data-dev="${sw.id}"] .body`));
    ok(G.cables().length === 2 && G.cables()[1].b.port === 1, '機器本体クリックで空きポートに自動接続');
    pointer('pointerdown', q('[data-port="pc2:0"]'));
    ok(/LANケーブル/.test(q('#panel').textContent), '使用中ポートのクリックでケーブルを選択');
    win.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Delete' }));
    ok(G.cables().length === 1 && G.funds() === 21500, 'Delete キーでケーブルを外すと返金される');
    const pa = q('[data-port="pc2:0"]'), pb = () => q(`[data-port="${sw.id}:3"]`);
    pointer('pointerdown', pa);
    fire('pointermove', win, center(pb()));
    fire('pointerup', win, center(pb()));
    ok(G.cables().length === 2 && G.cables()[1].b.port === 3, 'ポートからポートへのドラッグで配線');
    G.connect('prn1', 0, sw.id, 2);
    G.changed();

    // --- 設定 ---
    pointer('pointerdown', q('[data-dev="pc1"] .body'));
    pointer('pointerup', q('[data-dev="pc1"] .body'), win);
    input('[data-bind="ip"]', '192.168.1.999');
    ok(q('[data-bind="ip"]').classList.contains('bad'), '不正なIPは赤く表示');
    input('[data-bind="ip"]', '192.168.1.10');
    ok(G.device('pc1').cfg.ip === '192.168.1.10' && /192\.168\.1\.10\/24/.test(q('[data-dev="pc1"]').textContent), '設定の入力が機器と机の上の表示に反映');
    input('select[data-bind="prefix"]', '25');
    ok(G.device('pc1').cfg.prefix === 25, 'サブネットマスクの選択が数値で反映');
    input('select[data-bind="prefix"]', '24');
    ok(q('[data-act="deliver"]').disabled, '未達の間は納品ボタンが無効');
    q('[data-act="remove"]').click();
    ok(!G.device('pc1') && !!q('[data-pal="sup:pc1"]') && G.cables().length === 2, '片付けるとパレットに戻る');
    G.put('pc1', 300, 480);
    ok(G.device('pc1').cfg.ip === '192.168.1.10', '置き直すと設定が残っている');
    G.connect('pc1', 0, sw.id, 0);
    G.device('pc2').cfg.ip = '192.168.1.11';
    G.device('prn1').cfg.ip = '192.168.1.200';
    G.changed();
    ok(G.results().every(r => r.ok) && !q('[data-act="deliver"]').disabled, '全条件OKで納品ボタンが有効');

    // --- 診断ツールとパケットのアニメーション ---
    G.select('pc1');
    input('#diag-target', '192.168.1.200');
    q('[data-act="diag"][data-kind="ping"]').click();
    ok(/応答あり/.test(lastLog()), '診断 ping: ' + lastLog());
    ok(!!q('#fx .packet.k-ping'), 'ping でパケットが机の上を流れ始める');
    await sleep(2500);
    ok(!q('#fx .packet') && !q('#fx .failmark'), '成功した ping はアニメーション後に何も残さない');
    input('#diag-target', '192.168.1.77');
    q('[data-act="diag"][data-kind="ping"]').click();
    ok(/失敗/.test(lastLog()) && !!q('#fx .failmark'), '失敗した ping は止まった機器に×印が出る');
    await sleep(2000);
    ok(!q('#fx .failmark'), '×印はしばらくすると消える');
    q('[data-act="hint"]').click();
    ok(/ヒント 1\/3/.test(lastLog()), 'ヒント表示');

    // 机の上で機器を動かす
    const before = { ...G.device('pc1') };
    pointer('pointerdown', q('[data-dev="pc1"] .body'));
    const r = q('[data-dev="pc1"] .body').getBoundingClientRect();
    fire('pointermove', win, { clientX: r.x + 80, clientY: r.y - 60 });
    fire('pointerup', win, { clientX: r.x + 80, clientY: r.y - 60 });
    ok(G.device('pc1').x > before.x && G.device('pc1').y < before.y, 'ドラッグで機器が移動');

    // --- 納品 → 依頼ボード ---
    q('[data-act="deliver"]').click();
    ok(!q('#modal').classList.contains('hidden') && /納品完了/.test(q('#modal').textContent) && /★★★/.test(q('#modal').textContent) && /完璧/.test(q('#modal').textContent), '納品モーダル(★3とお客様のコメント)');
    ok(G.state().money === 40500 && /40,500/.test(q('#funds').textContent), '納品後の資金 40500 (実際: ' + G.state().money + ')');
    q('#modal [data-act="board"]').click();
    let b = board();
    ok(b.length === LEVELS.length && b.filter(x => x.open).map(x => x.id).join() === 'l1,l2,t1', '依頼ボード: 1件納品で l2 と t1 が解放 (' + b.filter(x => x.open).map(x => x.id).join() + ')');
    ok(/あと1件で解放/.test(b[3].text) && /トラブル対応/.test(b[2].text) && !q('#modal [data-act="close"]'), 'ロック中の依頼は残り件数を表示。納品直後は閉じるボタンなし');

    // --- トラブル対応: 既設のネットワークから始まる ---
    q('#modal .lv[data-id="t1"]').click();
    ok(G.state().levelId === 't1' && q('#modal').classList.contains('hidden'), 'ボードからトラブル対応の依頼を開始');
    ok(G.devices().length === 4 && G.cables().length === 2 && G.cost() === 0 && !q('.empty-hint'), 't1 既設の機器4台とケーブル2本が最初から机にある');
    ok(/すべて机に置いてあります/.test(q('#palette').textContent) && /トラブル対応/.test(q('#order').textContent), 't1 パレットと依頼文の表示');
    ok(G.device('pc2').cfg.ip === '192.168.11.12' && /192\.168\.11\.12/.test(q('[data-dev="pc2"]').textContent), 't1 既設の(間違った)設定が入っている');
    pointer('pointerdown', q('[data-port="prn1:0"]'));
    pointer('pointerup', q('[data-port="prn1:0"]'), win);
    pointer('pointerdown', q('[data-dev="sw"] .body'));
    ok(G.cables().length === 3 && G.cost() === 500, 't1 プリンタをスイッチにつなぐ(ケーブル購入)');
    G.select('pc2');
    input('[data-bind="ip"]', '192.168.1.12');
    ok(G.results().every(x => x.ok), 't1 IPを直すと全条件OK');
    ok(G.deliver() && G.state().money === 55000, 't1 納品後の資金 55000');
    q('#modal [data-act="board"]').click();
    b = board();
    ok(b.filter(x => x.open).map(x => x.id).join() === 'l1,l2,t1,t2' && /★★★/.test(b[2].text), '依頼ボード: 2件納品で t2 も解放、納品済みは★表示');

    // --- お客様のケーブルの再利用 ---
    q('#modal .lv[data-id="t2"]').click();
    const inetCable = G.cables().find(c => c.a.dev === 'inet');
    q('#canvas').dispatchEvent(new win.MouseEvent('contextmenu', { bubbles: true }));
    q(`[data-cable="${inetCable.id}"] .hit`).dispatchEvent(new win.MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
    ok(G.cables().length === 4 && G.spare() === 1 && /残り1本/.test(q('#palette').textContent), 't2 右クリックで外したお客様のケーブルは手元に残る');
    pointer('pointerdown', q('[data-port="inet:0"]'));
    pointer('pointerup', q('[data-port="inet:0"]'), win);
    pointer('pointerdown', q('[data-port="rt:0"]'));
    ok(G.cables().length === 5 && G.spare() === 0 && G.cost() === 0, 't2 つなぎ直しは無料');
    G.startLevel('t2', true);
    SOLUTIONS.t2(api);
    G.changed();
    ok(G.results().every(x => x.ok) && G.cost() === 0, 't2 模範解答で全条件OK・機材費0');
    ok(G.deliver() && G.state().money === 55000 + 25000, 't2 納品後の資金 80000');

    // --- サーバー: 買ってサービスを立てる ---
    G.startLevel('l2', true);
    SOLUTIONS.l2(api);
    G.changed();
    ok(G.deliver() && G.state().money === 94500, 'l2 納品後の資金 94500');
    G.startLevel('l3', true);
    ok(G.state().levelId === 'l3', '3件納品で l3 を開始できる');
    dragTile('buy:server', 780, 320);
    const srv = G.devices().find(d => d.type === 'server');
    ok(!!srv && /サービス停止中/.test(q(`[data-dev="${srv.id}"]`).textContent) && !q('[data-bind="forwarder"]'), 'サーバーを置いた直後はサービス停止中');
    check('[data-bind="dnsOn"]', true);
    ok(srv.cfg.dnsOn && !!q('[data-bind="forwarder"]') && /DNS/.test(q(`[data-dev="${srv.id}"]`).textContent), 'DNSサービスをオンにすると設定項目が出る');
    q('[data-act="add"][data-key="records"]').click();
    input('[data-bind="records.0.name"]', 'printer midori');
    ok(q('[data-bind="records.0.name"]').classList.contains('bad'), '不正なホスト名は赤く表示');
    input('[data-bind="records.0.name"]', 'printer.midori.local');
    input('[data-bind="records.0.ip"]', '192.168.1.200');
    input('[data-bind="forwarder"]', '8.8.8.8');
    ok(srv.cfg.records[0].name === 'printer.midori.local' && srv.cfg.records[0].ip === '192.168.1.200' && srv.cfg.forwarder === '8.8.8.8', 'DNSレコードとフォワーダーの入力');
    check('[data-bind="proxyOn"]', true);
    input('[data-bind="proxyPort"]', '3128');
    input('[data-bind="proxyAllow"]', '192.168.1.0/24');
    ok(srv.cfg.proxyOn && srv.cfg.proxyPort === 3128 && srv.cfg.proxyAllow === '192.168.1.0/24' && /DNS \+ プロキシ/.test(q(`[data-dev="${srv.id}"]`).textContent), 'プロキシサービスの設定');
    check('[data-bind="proxyOn"]', false);
    ok(!srv.cfg.proxyOn && !q('[data-bind="proxyPort"]'), 'プロキシをオフにすると設定項目が隠れる');

    // --- 残りの依頼は模範解答をAPIで適用し、全機器の設定パネル描画も確認 ---
    let money = 94500;
    for (const id of ['l3', 'l4', 'l5', 't3', 'l6']) {
      G.startLevel(id, true);
      ok(G.state().levelId === id, `${id} 解放済み`);
      SOLUTIONS[id](api);
      G.changed();
      for (const d of G.devices()) {
        G.select(d.id);
        ok(q('#panel h2').textContent === d.name, `${id} パネル描画: ${d.name}`);
      }
      const res = G.results();
      ok(res.every(x => x.ok), `${id} 模範解答で全条件OK` + (res.every(x => x.ok) ? '' : ' -> ' + res.find(x => !x.ok).reason));
      const lv = LEVELS.find(l => l.id === id);
      ok(G.cost() === lv.par, `${id} 機材費 ${G.cost()}`);
      const ds = G.devices(), overlap = ds.some((p, i) => ds.some((o, j) => j > i && Math.abs(p.x - o.x) < 50 && Math.abs(p.y - o.y) < 50));
      ok(!overlap, `${id} 機器が重ならない`);
      if (id === 'l6') {
        // Web閲覧の診断: 段階ごとのログとアニメーション
        G.select('o1');
        input('#diag-target', 'www.example.com');
        q('[data-act="diag"][data-kind="web"]').click();
        ok(/プロキシ経由/.test(lastLog()) && qa('#console .step').length === 3 && !!q('#fx .packet.k-web'), 'l6 Web閲覧の診断で各段階がログに出て、パケットが流れる');
        G.select('g1');
        input('#diag-target', '192.168.10.11');
        q('[data-act="diag"][data-kind="ping"]').click();
        await sleep(1500);
        const mark = q('#fx .failmark'), l3 = ds.find(d => d.type === 'l3');
        ok(!!mark && mark.getAttribute('transform') === `translate(${l3.x},${l3.y})`, 'l6 拒否ルールで止まったL3スイッチの上に×印');
      }
      money += lv.contract - G.cost();
      ok(G.deliver() && G.state().money === money, `${id} 納品後の資金 ${money}`);
    }
    ok(money === 598000 && /匠/.test(q('#rank').textContent) && /すべての依頼を納品/.test(q('#modal').textContent), '全依頼を★3で納品するとランクは匠');

    // L3スイッチのパネル操作(行の追加・削除)と売却
    G.startLevel('l6', true);
    const l3 = G.buy('l3');
    q('[data-act="add"][data-key="svis"]').click();
    input('[data-bind="svis.0.vlan"]', '30');
    input('[data-bind="svis.0.ip"]', '192.168.30.254');
    input('[data-bind="portVlan.2"]', '30');
    ok(G.device(l3).cfg.svis[0].vlan === 30 && G.device(l3).cfg.portVlan[2] === 30, 'L3: VLAN設定の入力');
    ok(/VLAN30 192\.168\.30\.254\/24/.test(q(`[data-dev="${l3}"]`).textContent), 'L3: 机の上にVLAN表示');
    q('[data-act="add"][data-key="routes"]').click();
    q('[data-act="add"][data-key="deny"]').click();
    ok(G.device(l3).cfg.routes.length === 1 && G.device(l3).cfg.deny.length === 1, 'L3: ルート/拒否ルールの追加');
    q('[data-act="del"][data-key="routes"]').click();
    ok(G.device(l3).cfg.routes.length === 0, 'L3: ルートの削除');
    q('[data-act="remove"]').click();
    ok(!G.device(l3) && G.cost() === 0, '売却で返金');
    G.select('inet');
    ok(!q('#panel [data-act="remove"]'), '回線は片付けられない');

    // 依頼ボード・セーブ
    q('#btn-levels').click();
    b = board();
    ok(b.every(x => x.open) && !!q('#modal [data-act="close"]'), '依頼ボード: 全依頼が解放済みで、閉じられる');
    q('#modal [data-act="close"]').click();
    const saved = JSON.parse(win.localStorage.getItem('netgame-v3'));
    ok(saved.money === money && Object.keys(saved.done).length === LEVELS.length, 'セーブデータに進行状況が保存される');
    q('#btn-help').click();
    ok(/遊び方/.test(q('#modal').textContent), '遊び方モーダル');
    q('#modal [data-act="close"]').click();

    ok(errors.length === 0, 'JSエラーなし' + (errors.length ? ': ' + errors.join(' | ') : ''));
  } catch (e) {
    ok(false, 'exception: ' + e.stack);
  }
  document.getElementById('out').textContent = out.join('\n') + '\nRESULT: ' + (failed ? `FAIL (${failed})` : 'PASS') + ` / ${out.length} checks`;
}
f.addEventListener('load', run);
if (f.contentDocument && f.contentDocument.readyState === 'complete') run();
</script>
